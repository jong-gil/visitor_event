<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이미 참여 완료</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      color: #1e293b;
      padding: 20px;
    }
    .card {
      max-width: 430px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 34px 28px;
      box-shadow: 0 20px 50px rgba(79, 70, 229, 0.14);
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tag {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.55rem; margin-bottom: 10px; }
    .info {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      margin: 18px 0;
    }
    .info strong { color: #4338ca; font-size: 1.2rem; }
    .status-win { color: #d97706; font-weight: 700; margin-top: 6px; }
    .status-lose { color: #64748b; margin-top: 6px; }
    button {
      width: 100%;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #f1f5f9; }
    .detail {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #475569;
    }
    .detail.open { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">ALREADY PARTICIPATED</div>
    <h1>이미 이벤트에 참여하셨습니다</h1>
    <p style="color: #64748b;">같은 기기(브라우저)에서는 최초 기록이 유지됩니다.</p>

    <div class="info">
      <div>기록된 방문 순번: <strong>#{{ visitor_num }}</strong></div>
      {% if is_winner %}
        <div class="status-win">🎉 당첨 이력이 확인되었습니다!</div>
      {% else %}
        <div class="status-lose">당첨 순번이 아니었습니다.</div>
      {% endif %}
    </div>

    <button type="button" id="toggleBtn">참여 안내 자세히 보기</button>
    <div class="detail" id="detailBox">
      이벤트 공정성을 위해 한 브라우저/디바이스당 1회만 카운트됩니다. 이전 참여 결과는 서버 기록에 안전하게 보관되어 있습니다.
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById("toggleBtn");
    const detailBox = document.getElementById("detailBox");

    toggleBtn.addEventListener("click", () => {
      const isOpen = detailBox.classList.toggle("open");
      toggleBtn.textContent = isOpen ? "참여 안내 접기" : "참여 안내 자세히 보기";
    });
  </script>
</body>
</html>
