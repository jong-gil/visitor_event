<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>축하합니다! 당첨!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      color: #1e293b;
      overflow-x: hidden;
      padding: 20px;
    }
    .card {
      position: relative;
      z-index: 2;
      max-width: 430px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 34px 28px;
      box-shadow: 0 20px 50px rgba(217, 119, 6, 0.15);
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tag {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.55rem; margin-bottom: 8px; }
    .desc { color: #64748b; }
    .info {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 16px;
      padding: 16px;
      margin: 18px 0;
    }
    .info strong { color: #d97706; font-size: 1.25rem; }
    .code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #fcd34d;
    }
    .code-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      color: #92400e;
      font-size: 0.98rem;
    }
    .copy-btn {
      border: none;
      background: #d97706;
      color: #ffffff;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #b45309; }
    .copy-msg {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #b45309;
      min-height: 1.1em;
    }
    .toggle-btn {
      width: 100%;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-btn:hover { background: #f8fafc; }
    .detail {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #475569;
    }
    .detail.open { display: block; }
    .confetti {
      position: fixed;
      top: -12px;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      z-index: 1;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(540deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">EVENT WINNER</div>
    <h1>축하합니다! 당첨되셨습니다</h1>
    <p class="desc">행운의 당첨 순번에 도달하셨어요.</p>

    <div class="info">
      <div>당첨 방문 순번: <strong>#{{ visitor_num }}</strong></div>
      <div class="code-row">
        <span class="code-val" id="winCode">WIN-{{ visitor_num }}</span>
        <button class="copy-btn" type="button" id="copyBtn">코드 복사</button>
      </div>
      <div class="copy-msg" id="copyMsg"></div>
    </div>

    <button class="toggle-btn" type="button" id="toggleBtn">경품 수령 안내 보기</button>
    <div class="detail" id="detailBox">
      당첨 코드 <strong>WIN-{{ visitor_num }}</strong>를 복사하거나 화면을 캡처해 보관해 주세요. 동일 브라우저로 재접속해도 당첨 이력이 유지됩니다.
    </div>
  </div>

  <script>
    const colors = ["#f59e0b", "#ef4444", "#10b981", "#3b82f6", "#8b5cf6"];
    for (let i = 0; i < 32; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colors[i % colors.length];
      piece.style.animationDuration = (2.0 + Math.random() * 1.8) + "s";
      piece.style.animationDelay = (Math.random() * 0.9) + "s";
      document.body.appendChild(piece);
    }

    const copyBtn = document.getElementById("copyBtn");
    const winCode = document.getElementById("winCode").textContent;
    const copyMsg = document.getElementById("copyMsg");

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(winCode);
        copyBtn.textContent = "복사됨";
        copyMsg.textContent = "당첨 코드가 클립보드에 복사되었습니다.";
      } catch {
        copyMsg.textContent = "코드를 직접 선택해 복사해 주세요.";
      }
    });

    const toggleBtn = document.getElementById("toggleBtn");
    const detailBox = document.getElementById("detailBox");
    toggleBtn.addEventListener("click", () => {
      const isOpen = detailBox.classList.toggle("open");
      toggleBtn.textContent = isOpen ? "경품 수령 안내 접기" : "경품 수령 안내 보기";
    });
  </script>
</body>
</html>
